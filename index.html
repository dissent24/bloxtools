<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Hub</title>
<style>
  :root { --blue:#1e6bff; --red:#c4161c; --green:#1fb54a; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#000; color:#fff; min-height:100vh; }

  .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px; }
  .gallery figure { border-radius:12px; overflow:hidden; border:1px solid #222; background:#0a0a0a; }
  .gallery svg { display:block; width:100%; height:auto; }

  .split { display:grid; grid-template-columns:1fr 1fr; min-height:70vh; }
  .visual { display:flex; align-items:center; justify-content:center; padding:32px; }
  .visual svg { width:min(380px,80%); height:auto; filter:drop-shadow(0 0 40px rgba(30,107,255,.55)); }
  .panel { display:flex; align-items:center; justify-content:center; padding:32px; }
  .form-wrap { width:100%; max-width:440px; }
  label { display:block; font-size:1.3rem; font-weight:700; margin-bottom:10px; letter-spacing:.02em; }
  textarea { width:100%; min-height:200px; font:inherit; font-size:1rem; padding:14px; border:2px solid #ff4b52; border-radius:12px; background:var(--red); color:#fff; resize:vertical; }
  textarea::placeholder { color:rgba(255,255,255,.6); }
  textarea:focus { outline:3px solid #ff8a8f; outline-offset:2px; }
  button { width:100%; margin-top:16px; font:inherit; font-size:1.1rem; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--green); color:#fff; cursor:pointer; transition:filter .15s, transform .1s; }
  button:hover { filter:brightness(1.12); } button:active { transform:translateY(1px); }
  .hp { position:absolute; left:-9999px; }

  @media (max-width:820px) {
    .gallery { grid-template-columns:1fr; }
    .split { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- Top images: original illustrations. Swap any <svg> block for <img src="your-image.jpg" alt="..."> to use your own pictures. -->
<section class="gallery" aria-label="Gallery">
  <figure>
    <svg viewBox="0 0 400 260" role="img" aria-label="Blocky world with a tall tower">
      <rect width="400" height="260" fill="#0b1b3a"/>
      <circle cx="320" cy="55" r="26" fill="#ffd84a"/>
      <rect y="190" width="400" height="70" fill="#1f9d4a"/>
      <rect y="225" width="400" height="35" fill="#6b4226"/>
      <g stroke="#0b1b3a" stroke-width="3">
        <rect x="70" y="150" width="40" height="40" fill="#e44d4d"/>
        <rect x="70" y="110" width="40" height="40" fill="#f2b632"/>
        <rect x="70" y="70" width="40" height="40" fill="#1e6bff"/>
        <rect x="150" y="150" width="40" height="40" fill="#1e6bff"/>
        <rect x="190" y="150" width="40" height="40" fill="#e44d4d"/>
        <rect x="170" y="110" width="40" height="40" fill="#f2b632"/>
        <rect x="270" y="150" width="40" height="40" fill="#8a4fff"/>
      </g>
    </svg>
  </figure>
  <figure>
    <svg viewBox="0 0 400 260" role="img" aria-label="Game controller">
      <rect width="400" height="260" fill="#14061f"/>
      <path d="M90 90h220q50 0 62 70t-30 55q-25 0-45-35H103q-20 35-45 35-42 15-30-55t62-70z" fill="#2c2f3a" stroke="#6b7088" stroke-width="4"/>
      <rect x="95" y="118" width="50" height="14" rx="3" fill="#fff"/>
      <rect x="113" y="100" width="14" height="50" rx="3" fill="#fff"/>
      <circle cx="285" cy="108" r="11" fill="#1fb54a"/>
      <circle cx="313" cy="130" r="11" fill="#e44d4d"/>
      <circle cx="257" cy="130" r="11" fill="#1e6bff"/>
      <circle cx="285" cy="152" r="11" fill="#f2b632"/>
    </svg>
  </figure>
  <figure>
    <svg viewBox="0 0 400 260" role="img" aria-label="Floating block islands at night">
      <rect width="400" height="260" fill="#071a2e"/>
      <g fill="#fff"><circle cx="40" cy="40" r="2"/><circle cx="130" cy="25" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="360" cy="30" r="2"/><circle cx="300" cy="90" r="2"/></g>
      <g stroke="#071a2e" stroke-width="3">
        <rect x="40" y="130" width="120" height="24" fill="#1fb54a"/>
        <rect x="55" y="154" width="90" height="34" fill="#6b4226"/>
        <rect x="75" y="188" width="50" height="22" fill="#4a2e1a"/>
        <rect x="230" y="90" width="110" height="24" fill="#1fb54a"/>
        <rect x="245" y="114" width="80" height="34" fill="#6b4226"/>
        <rect x="265" y="148" width="40" height="22" fill="#4a2e1a"/>
        <rect x="270" y="62" width="28" height="28" fill="#1e6bff"/>
      </g>
    </svg>
  </figure>
</section>

<main class="split">
  <section class="visual" aria-label="Blue block icon">
    <!-- Original blue block icon (generic cube), not a trademarked logo -->
    <svg viewBox="0 0 300 300" role="img" aria-label="Blue cube icon">
      <polygon points="150,30 255,90 255,210 150,270 45,210 45,90" fill="#1e6bff"/>
      <polygon points="150,30 255,90 150,150 45,90" fill="#5b95ff"/>
      <polygon points="150,150 255,90 255,210 150,270" fill="#1049b8"/>
    </svg>
  </section>

  <section class="panel">
    <form class="form-wrap" action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">
      <input type="hidden" name="_subject" value="New submission">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="thanks.html">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

      <label for="entry">Paste Here</label>
      <textarea id="entry" name="submission" required></textarea>
      <button type="submit">Enter</button>
    </form>
  </section>
</main>
</body>
</html>
